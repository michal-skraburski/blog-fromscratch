server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro emits hashed, immutable assets under /_astro/
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Directory-style pretty URLs: /blog/hello-world -> /blog/hello-world/index.html
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
