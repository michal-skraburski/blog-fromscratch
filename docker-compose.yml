services:
  # TLS terminates at Cloudflare; cloudflared forwards plain HTTP to this.
  # Point the tunnel's public hostname at http://<host>:80.
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  web:
    # In CI/deploy this pulls the registry image; locally `docker compose build`
    # will build from the Dockerfile instead.
    image: ${CI_REGISTRY_IMAGE:-blog}:${IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.blog.entrypoints=web"
      - "traefik.http.services.blog.loadbalancer.server.port=80"
