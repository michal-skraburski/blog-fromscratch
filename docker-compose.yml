services:
  # Static site served by nginx. Discovered by the Traefik instance that
  # already runs on this host via the labels below + the shared network.
  # TLS terminates at Cloudflare; Traefik routes plain HTTP to this.
  nginx:
    # In CI/deploy this pulls the registry image; locally `docker compose build`
    # will build from the Dockerfile instead.
    container_name: blog_fromscratch_nginx
    image: ${CI_REGISTRY_IMAGE:-blog}:${IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.blog.rule=Host(`skraburski.com`)"
      - "traefik.http.routers.blog.entrypoints=web"
      - "traefik.http.routers.blog.service=blog"
      - "traefik.http.services.blog.loadbalancer.server.port=80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s

networks:
  # The network the existing Traefik container is attached to.
  proxy:
    external: true
