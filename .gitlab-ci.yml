stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Build the image and push it to the GitLab Container Registry.
build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Runs on a runner that lives ON the deploy host so docker + compose talk to
# the host's own daemon. Tag that runner `deploy` (Settings > CI/CD > Runners).
# The `docker:27` image ships the docker CLI + compose plugin.
# NOTE: the runner must expose the host Docker socket to this job, e.g. in the
# runner's config.toml:
#   [runners.docker]
#   volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
deploy:
  stage: deploy
  image: docker:27
  tags:
    - deploy
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker compose pull
    - docker compose up -d --remove-orphans
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
